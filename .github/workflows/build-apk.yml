name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ipspeed-apk-build
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Compile unchanged Go source for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          test -s app/src/main/assets/myspeed.go
          sha256sum app/src/main/assets/myspeed.go | tee /tmp/myspeed.sha256
          export GOOS=android GOARCH=arm64 CGO_ENABLED=0
          export GOPROXY=https://mirrors.aliyun.com/goproxy/,direct
          go build -trimpath -o app/src/main/assets/sss app/src/main/assets/myspeed.go
          chmod 755 app/src/main/assets/sss
          sha256sum -c /tmp/myspeed.sha256

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Build APK (single task)
        run: gradle --no-daemon --max-workers=1 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ipspeed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
