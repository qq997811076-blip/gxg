name: Build APK

on:
  push:
    branches:
      - main
      - add-official-independent-ui-20261029
      - official-cf-ip-random-65534-20261029
      - ui-two-mode-switch-20261029
      - official-connectivity-groups-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ipspeed-apk-build
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare stable APK signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/gxg-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Compile Go source for Android ARM64 without modifying source
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/myspeed.go
          sha256sum app/src/main/assets/myspeed.go | tee /tmp/myspeed.sha256
          export GOOS=android GOARCH=arm64 CGO_ENABLED=0
          export GOPROXY=https://mirrors.aliyun.com/goproxy/,direct
          go build -trimpath -o app/src/main/assets/sss app/src/main/assets/myspeed.go
          chmod 755 app/src/main/assets/sss
          sha256sum -c /tmp/myspeed.sha256

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Build APK (single task)
        run: gradle --no-daemon --max-workers=1 assembleDebug

      - name: Rename APK with actual generation timestamp
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          STAMP="$(date +%Y%m%d-%H%M%S)"
          mv "$APK" "app/build/outputs/apk/debug/$STAMP.apk"
          echo "APK_PATH=app/build/outputs/apk/debug/$STAMP.apk" >> "$GITHUB_ENV"
          sha256sum "app/build/outputs/apk/debug/$STAMP.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ipspeed-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
